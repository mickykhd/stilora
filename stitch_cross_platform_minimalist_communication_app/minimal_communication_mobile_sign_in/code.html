<!DOCTYPE html>

<html lang="en"><head>

            "surface-container": "#e9edff",
            "secondary": "#0051d5",
            "surface-dim": "#d3daef",
            "inverse-on-surface": "#edf0ff",

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-between items-center selection:bg-surface-container selection:text-primary">
<!-- Mobile Envelope Shell -->
<main class="w-full max-w-md mx-auto min-h-screen flex flex-col justify-between px-margin-mobile py-space-xl sm:px-margin sm:py-space-xl">
<!-- Top System & Identity Header -->
<header class="flex flex-col items-center text-center">
<!-- Minimalist Dynamic Brand Icon -->
<div class="w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center border border-surface-variant/40 mb-space-md">
<span class="material-symbols-outlined text-primary" data-icon="grain" style="font-variation-settings: 'FILL' 1;">grain</span>
</div>
<!-- Exact Brand Name Casing Anchor -->
<span class="font-headline-sm text-headline-sm font-semibold tracking-tight text-on-surface mb-space-xs">Stilora</span>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface font-medium tracking-tight">Welcome back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs max-w-xs">Sign in with your email and password to restore your continuous focus stream.</p>
</header>
<!-- Interactive Authentication Core Card -->
<section class="w-full my-space-lg bg-surface-container-lowest border border-surface-variant/30 rounded-xl p-space-lg">
<!-- Single auth method: email + password (our own database — no third-party OAuth) -->
<div class="space-y-space-md">
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider" for="work-email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-lg pointer-events-none" data-icon="alternate_email">alternate_email</span>
<input autocomplete="username" class="w-full pl-10 pr-3 py-2.5 bg-surface-container-low border border-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-all duration-150" id="work-email" inputmode="email" placeholder="alex@studio.design" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block font-label-sm text-label-sm uppercase text-on-surface-variant tracking-wider" for="account-pwd">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:underline" href="#">Forgot?</a>
</div>
<input autocomplete="current-password" class="w-full px-3 py-2.5 bg-surface-container-low border border-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-all duration-150" id="account-pwd" placeholder="••••••••••••" type="password"/>
</div>
<button class="w-full py-3 px-4 bg-primary-container hover:opacity-90 active:opacity-80 text-on-secondary rounded-lg font-label-md text-label-md transition-all duration-150 flex items-center justify-center gap-2" type="button">
<span>Sign in</span>
<span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center font-body-sm text-body-sm text-outline">New here? Your account is created with your workspace.</p>
</div>
</section>
<!-- Bottom Contextual Footer & Security Assurance -->
<footer class="flex flex-col items-center text-center space-y-space-md pt-space-xs">
<div class="font-body-md text-body-md text-on-surface-variant">
        Need an account?
        <a class="text-primary font-medium hover:underline ml-1" href="#">Create account</a>
</div>
<!-- Trust Metadata Badge -->
<div class="inline-flex items-center gap-1.5 py-1 px-3 bg-surface-container-low rounded-full border border-surface-variant/40">
<span class="material-symbols-outlined text-outline text-xs" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm text-outline-variant font-medium text-on-surface-variant">Encrypted in transit &amp; at rest</span>
</div>
</footer>
</main>
</body></html>
