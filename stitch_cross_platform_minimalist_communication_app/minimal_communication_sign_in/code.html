<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

            "inverse-surface": "#293040",

            "surface-container-lowest": "#ffffff",

          "spacing": {

<style>
    .subtle-border {
      border: 1px solid rgba(17, 24, 39, 0.06);
    }
    .ambient-halo {
      box-shadow: 0 20px 40px -15px rgba(17, 24, 39, 0.04);
    }
  </style>
</head>
<body class="h-full bg-surface text-on-surface antialiased flex flex-col justify-between selection:bg-surface-container-highest">
<!-- Header Anchor / Quiet Brand Bar -->
<header class="w-full flex items-center justify-between px-space-xl py-space-lg">
<div class="flex items-center gap-space-sm">
<div class="w-7 h-7 rounded-lg bg-surface-container-highest flex items-center justify-center border border-surface-variant/40">
<span class="material-symbols-outlined text-primary" data-icon="grain" style="font-size: 18px;">grain</span>
</div>
<span class="font-headline-sm text-headline-sm font-semibold tracking-tight text-on-surface">Stilora</span>
</div>
<div class="flex items-center gap-space-md">
<span class="font-body-sm text-body-sm text-on-surface-variant hidden sm:inline">Need a workspace?</span>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors duration-150" href="#">Create account</a>
</div>
</header>
<!-- Central Sanctuary / Auth Canvas -->
<main class="flex-1 flex items-center justify-center px-margin-mobile md:px-margin py-space-lg">
<div class="w-full max-w-[420px] bg-surface-container-lowest subtle-border rounded-xl p-space-xl ambient-halo transition-all duration-200">
<!-- Logo Mark and Heading -->
<div class="flex flex-col items-center text-center mb-space-xl">
<div class="w-10 h-10 rounded-xl bg-surface-container-low border border-surface-variant/60 flex items-center justify-center mb-space-md">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="grain">grain</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-medium">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">Sign in with your email and password</p>
</div>
<!-- Single auth method: email + password (our own database — no third-party OAuth) -->
<form class="space-y-space-md" onsubmit="event.preventDefault();">
<!-- Input Field: Recessed Scandinavian aesthetic -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="work-email">Email</label>
<div class="relative">
<input autocomplete="username" class="w-full rounded-lg bg-surface-container-low border border-transparent px-space-sm py-2 text-body-md font-body-md text-on-surface placeholder-outline focus:bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all duration-150" id="work-email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<input autocomplete="current-password" class="w-full rounded-lg bg-surface-container-low border border-transparent px-space-sm py-2 text-body-md font-body-md text-on-surface placeholder-outline focus:bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all duration-150" id="password" placeholder="••••••••••••" type="password"/>
</div>
<!-- Primary Submit CTA -->
<button class="w-full py-2.5 px-space-md rounded-lg bg-primary-container hover:opacity-95 text-on-primary font-label-md text-label-md flex items-center justify-center gap-space-xs transition-opacity duration-150" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center font-body-sm text-body-sm text-outline">New here? Your account is created with your workspace.</p>
</form>
<!-- Trust Footer within Card -->
<div class="mt-space-lg pt-space-md border-t border-surface-variant/50 flex items-center justify-between text-on-surface-variant">
<div class="flex items-center gap-1.5 font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[15px] text-outline" data-icon="lock">lock</span>
<span>Encrypted in transit &amp; at rest</span>
</div>
<div class="flex items-center gap-1 font-label-sm text-label-sm text-outline">
<span class="material-symbols-outlined text-[15px]" data-icon="schedule">schedule</span>
<span>SSO Ready</span>
</div>
</div>
</div>
</main>
<!-- Quiet Scandinavian Meta Footer -->
<footer class="w-full py-space-md px-space-xl flex flex-col sm:flex-row items-center justify-between gap-space-xs text-on-surface-variant font-label-sm text-label-sm">
<div class="flex items-center gap-space-md">
<a class="hover:text-on-surface transition-colors" href="#">Privacy</a>
<a class="hover:text-on-surface transition-colors" href="#">Terms</a>
<a class="hover:text-on-surface transition-colors" href="#">System Status</a>
</div>
<div class="flex items-center gap-2 text-outline">
<span>Stilora · v1.0</span>
</div>
</footer>
</body></html>
