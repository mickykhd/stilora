<script>
    // Micro-interactions for quiet stage state toggles
    let isMuted = true;
    function toggleMicrophone() {
      isMuted = !isMuted;
      const btn = document.getElementById('btn-mic');
      const icon = document.getElementById('mic-icon');
      if (!isMuted) {
        btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        btn.classList.add('bg-primary-container', 'text-on-primary');
        icon.textContent = 'mic';
      } else {
        btn.classList.remove('bg-primary-container', 'text-on-primary');
        btn.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        icon.textContent = 'mic_off';
      }
    }

    let isVideoOn = true;
    function toggleCamera() {
      isVideoOn = !isVideoOn;
      const btn = document.getElementById('btn-video');
      const icon = document.getElementById('video-icon');
      if (isVideoOn) {
        btn.classList.remove('bg-surface-container-highest');
        icon.textContent = 'videocam';
      } else {
        btn.classList.add('bg-surface-container-highest');
        icon.textContent = 'videocam_off';
      }
    }
  </script>
