name: stilora
description: "Stilora — a calm, focused communication workspace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Offline-first local cache
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.36
  path_provider: ^2.1.5
  path: ^1.9.1
  # State management
  flutter_riverpod: ^2.6.1
  # HTTP + realtime
  dio: ^5.8.0
  ably_flutter: ^1.2.16
  # Voice/video
  livekit_client: ^2.3.10
  # Local notifications (desktop push)
  flutter_local_notifications: ^19.1.0
  # Permissions
  permission_handler: ^12.0.1
  # Sentry — error monitoring (free tier)
  sentry_flutter: ^9.16.0
  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.14
  # Golden management
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
